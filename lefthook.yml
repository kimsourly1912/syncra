# Git hooks for the three apps, installed by `pnpm install` (lefthook). There's no CI, so these
# are the checks: each job runs only when the commit or push touches its own app's folder, so an
# Admin change never runs Portal or Web checks.
#
#   On commit: ESLint on the staged files of the app you touched (seconds), Admin's API contract,
#              the size of any staged AGENTS.md, and the docs' links when a .md file is staged.
#   On push:   typecheck and tests of each app with changes in the pushed commits, plus Admin's knip
#              and e2e smoke tests (about 2–3 minutes for an Admin push).
#   By hand:   the plain build, before a merge request (the commands are in each app's AGENTS.md).
#
# Run a hook without committing: `pnpm exec lefthook run pre-commit` (or `pre-push`).
# Never skip a hook with `--no-verify`: hosted CI costs money on this private repo, so these are
# the only checks (AGENTS.md).

pre-commit:
  parallel: true
  jobs:
    - name: admin lint
      root: src/admin/
      glob: "*.{ts,mts,js,mjs,vue}"
      run: pnpm exec eslint --no-warn-ignored {staged_files}

    # app/api/generated must be what `api:gen` makes from the committed spec: never edited by hand,
    # and regenerated (and staged) whenever the spec or the generator changes.
    - name: admin api contract
      glob: "src/admin/{openapi/**,app/api/generated/**,openapi-ts.config.ts,scripts/gen-endpoints.mjs}"
      run: node src/admin/scripts/check-api-contract.mjs

    # Agent instruction files stay under their limits: 6 KiB at the root, 4 KiB per app (AGENTS.md).
    - name: instruction file size
      glob: "{AGENTS.md,src/*/AGENTS.md}"
      run: node scripts/check-instruction-size.mjs

    # Relative links between the docs point at files and headings that exist.
    - name: doc links
      glob: "*.md"
      run: node scripts/check-doc-links.mjs

    # Portal and Web already have lint errors in files nobody is changing, so only the staged files
    # are checked: fix what's in a file you touch (AGENTS.md, Scope).
    - name: portal lint
      root: src/portal/
      glob: "*.{ts,mts,js,mjs,vue}"
      run: pnpm exec eslint --no-warn-ignored {staged_files}

    - name: web lint
      root: src/web/
      glob: "*.{ts,mts,js,mjs,vue}"
      run: pnpm exec eslint --no-warn-ignored {staged_files}

pre-push:
  # Stop at the first failure: no e2e build after failing tests.
  piped: true
  jobs:
    # Unused files, exports, and dependencies (knip.json), in about 2 seconds. Runs from the root:
    # knip reads the whole workspace.
    - name: admin knip
      glob: "src/admin/**"
      run: pnpm exec knip --workspace src/admin --no-progress

    - name: admin typecheck and tests
      root: src/admin/
      glob: "*"
      run: pnpm typecheck && pnpm test

    # Builds the app and drives it in Chromium with a mocked API (test/e2e). Needs Playwright's
    # Chromium once per machine: `pnpm --filter admin exec playwright-core install chromium-headless-shell`.
    - name: admin e2e
      root: src/admin/
      glob: "*"
      run: pnpm test:e2e

    # Only Portal's unit tests: its Nuxt suite doesn't load (src/portal/docs/testing.md). Add `pnpm test:nuxt --run`
    # here once they pass.
    - name: portal unit tests
      root: src/portal/
      glob: "*"
      run: pnpm test:unit --run

  # Web has no push check yet: it has no tests (src/web/docs/testing.md).

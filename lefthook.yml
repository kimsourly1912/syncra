# Git hooks for the three apps, installed by `pnpm install` (lefthook). There's no CI, so these
# are the checks: each job runs only when the commit or push touches its own app's folder, so an
# Admin change never runs Portal or Web checks.
#
#   On commit: ESLint on the staged files of the app you touched (seconds).
#   On push:   typecheck and tests of each app with changes in the pushed commits, and Admin's e2e
#              smoke tests (about 1–2 minutes for an Admin push).
#   By hand:   the plain build, before a merge request (the commands are in each app's AGENTS.md).
#
# Run a hook without committing: `pnpm exec lefthook run pre-commit` (or `pre-push`).
# Skip once, when you must: `git commit --no-verify` (or `git push --no-verify`).

pre-commit:
  parallel: true
  jobs:
    - name: admin lint
      root: src/admin/
      glob: "*.{ts,mts,js,mjs,vue}"
      run: pnpm exec eslint --no-warn-ignored {staged_files}

    # app/api/generated must be what `api:gen` makes from the committed spec: never edited by hand,
    # and regenerated (and staged) whenever the spec or the generator changes.
    - name: admin api contract
      glob: "src/admin/{openapi/**,app/api/generated/**,openapi-ts.config.ts,scripts/gen-endpoints.mjs}"
      run: node src/admin/scripts/check-api-contract.mjs

    # Portal and Web already have lint errors in files nobody is changing, so only the staged files
    # are checked: fix what's in a file you touch (AGENTS.md, Scope).
    - name: portal lint
      root: src/portal/
      glob: "*.{ts,mts,js,mjs,vue}"
      run: pnpm exec eslint --no-warn-ignored {staged_files}

    - name: web lint
      root: src/web/
      glob: "*.{ts,mts,js,mjs,vue}"
      run: pnpm exec eslint --no-warn-ignored {staged_files}

pre-push:
  # Stop at the first failure: no e2e build after failing tests.
  piped: true
  jobs:
    - name: admin typecheck and tests
      root: src/admin/
      glob: "*"
      run: pnpm typecheck && pnpm test

    # Builds the app and drives it in Chromium with a mocked API (test/e2e). Needs Playwright's
    # Chromium once per machine: `pnpm --filter admin exec playwright-core install chromium-headless-shell`.
    - name: admin e2e
      root: src/admin/
      glob: "*"
      run: pnpm test:e2e

    # Only Portal's unit tests: 65 of its 69 Nuxt tests fail on main. Add `pnpm test:nuxt --run`
    # here once they pass.
    - name: portal unit tests
      root: src/portal/
      glob: "*"
      run: pnpm test:unit --run

  # Web has no push check yet: its only test is the failing `sum.test.ts` placeholder (src/web/AGENTS.md).
